name: 당첨번호 갱신
on:
  schedule:
    - cron: "50 11 * * 6"          # 토 20:50 KST (추첨 20:35 직후)
    - cron: "*/10 12-15 * * 6"     # 토 21:00~00:50 KST 10분마다 (결과를 가장 빨리)
    - cron: "10 23 * * 6"          # 일 08:10 KST (늦을 때 대비)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F) 당첨번호" && git push)
